<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#141414"/>

  <!-- Outer ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#5060a0" stroke-width="18" opacity="0.9"/>

  <!-- Middle ring -->
  <circle cx="512" cy="512" r="220" fill="none" stroke="#5060a0" stroke-width="10" opacity="0.6"/>

  <!-- Inner ring -->
  <circle cx="512" cy="512" r="100" fill="none" stroke="#8090c8" stroke-width="8" opacity="0.85"/>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="22" fill="#8090c8"/>

  <!-- Crosshair — top -->
  <line x1="512" y1="120" x2="512" y2="380" stroke="#5060a0" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <!-- gap top: 380–420 (inner ring gap) -->
  <line x1="512" y1="420" x2="512" y2="490" stroke="#8090c8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Crosshair — bottom -->
  <line x1="512" y1="534" x2="512" y2="604" stroke="#8090c8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- gap bottom: 604–644 -->
  <line x1="512" y1="644" x2="512" y2="904" stroke="#5060a0" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- Crosshair — left -->
  <line x1="120" y1="512" x2="380" y2="512" stroke="#5060a0" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <line x1="420" y1="512" x2="490" y2="512" stroke="#8090c8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Crosshair — right -->
  <line x1="534" y1="512" x2="604" y2="512" stroke="#8090c8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="644" y1="512" x2="904" y2="512" stroke="#5060a0" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- Tick marks on outer ring — 12, 3, 6, 9 o'clock -->
  <line x1="512" y1="158" x2="512" y2="198" stroke="#8090c8" stroke-width="6" stroke-linecap="round"/>
  <line x1="512" y1="826" x2="512" y2="866" stroke="#8090c8" stroke-width="6" stroke-linecap="round"/>
  <line x1="158" y1="512" x2="198" y2="512" stroke="#8090c8" stroke-width="6" stroke-linecap="round"/>
  <line x1="826" y1="512" x2="866" y2="512" stroke="#8090c8" stroke-width="6" stroke-linecap="round"/>

  <!-- Subtle glow ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#5060a0" stroke-width="40" opacity="0.06"/>
</svg>
